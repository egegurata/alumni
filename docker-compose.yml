services:
  web:
    build: .
    container_name: alumni_web
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      - POSTGRES_USER=${POSTGRES_USER:-alumni_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-alumni_password}
      - POSTGRES_DB=${POSTGRES_DB:-alumni_db}
      - DB_HOST=db
      - DB_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-alumni_user}:${POSTGRES_PASSWORD:-alumni_password}@db:5432/${POSTGRES_DB:-alumni_db}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: alumni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alumni_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni_password}
      POSTGRES_DB: ${POSTGRES_DB:-alumni_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-alumni_user} -d $${POSTGRES_DB:-alumni_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
